apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-v3
  labels:
    app: notification
    version: v3
    student: "24mis0384"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
      version: v3
  template:
    metadata:
      labels:
        app: notification
        version: v3
    spec:
      containers:
      - name: notification-app-v3
        image: 24mis0384/notification-app:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: notification-v3-service
  labels:
    app: notification
    version: v3
spec:
  type: NodePort
  selector:
    app: notification
    version: v3
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30003
    name: http
