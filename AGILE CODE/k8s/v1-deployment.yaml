apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-v1
  labels:
    app: notification
    version: v1
    student: "24mis0384"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
      version: v1
  template:
    metadata:
      labels:
        app: notification
        version: v1
    spec:
      containers:
      - name: notification-app-v1
        image: 24mis0384/notification-app:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: notification-v1-service
  labels:
    app: notification
    version: v1
spec:
  type: NodePort
  selector:
    app: notification
    version: v1
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001
    name: http
