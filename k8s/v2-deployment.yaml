apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-v2
  labels:
    app: notification
    version: v2
    student: "24mis0384"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
      version: v2
  template:
    metadata:
      labels:
        app: notification
        version: v2
    spec:
      containers:
      - name: notification-app-v2
        image: 24mis0384/notification-app:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-v2-service
  labels:
    app: notification
    version: v2
spec:
  type: NodePort
  selector:
    app: notification
    version: v2
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30002
    name: http
